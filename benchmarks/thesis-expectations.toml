# Per-GPU expectations for the performance-thesis harness
# (`ml_bench thesis`, see benchmarks/THESES.md).
#
# Sections are keyed by the EXACT Vulkan device name the harness logs
# (`VulkanContext::device_name`).  A device without a section still
# runs every measurement but reports `info` instead of PASS/FAIL —
# add a section (copying this one and re-recording the numbers from a
# clean run) to arm the regression gate for that GPU.  This is a
# strict TOML subset: quoted-or-bare section headers, `key = <float>`,
# `#` comments (parser: tools/ml-bench/src/bench/thesis/expect.rs).

["NVIDIA GeForce RTX 3070"]
# GA104 spec-sheet memory bandwidth; every bandwidth floor divides by
# this, so per-GPU sections MUST re-record it (e.g. the 4060 is 272).
mem_bw_gbps = 448.0

# T1: decode achieved weight bandwidth >= this fraction of mem_bw_gbps.
# Baseline 2026-08-15 measured 79.4% (356 GB/s) — the floor below is a
# regression guard just under that; 80%+ is the target, and the gap is
# concentrated in the 30%-efficiency k/v projections (see T2), not
# spread across the token.
t1_min_bw_frac = 0.78

# T2: every decode GEMV class >= this fraction of its bandwidth floor
# (leg 13/15: row GEMVs measured 81-89% of floor; the tiny k/v
# 2048x256 class is the one to watch — launch overhead bites first).
t2_min_bw_frac = 0.80

# T3: full compute-barrier drain on a trivial kernel, in microseconds.
# FALSIFIED 2026-08-15: the leg-5-era ~7.7 us figure did not survive
# direct measurement — the chain-slope microbench puts the drain at
# ~0.9 us on GA104/595.80 (34->266 us serial vs 6->31 us overlapped,
# 32->256 dispatches).  The old figure conflated barrier drain with
# per-op submission overhead (T4's ~25 us) from the pre-graph era.
# Consequence: decode's ~158 barriers/token cost ~0.15 ms, not
# ~1.2 ms — barrier elimination is NOT a decode lever.
t3_barrier_us = 0.92
t3_rel_tol = 1.00

# T4: one vkQueueSubmit + fence-wait round-trip, in microseconds
# (campaign ledger: ~30-60 us per synchronous submission on this
# host; v1.5's 50 us spin-wait sits inside this band).  Measured
# value must land in [lo*(1-tol), hi*(1+tol)].
t4_submit_us_lo = 30.0
t4_submit_us_hi = 60.0
t4_edge_tol = 0.20

# T5: |piecewise sum - whole pp512 graph| as a fraction of the whole.
# The sum is expected to OVERestimate (standalone runs cannot overlap
# independent neighbours the way the graph does); baseline 2026-08-15
# measured +15.2%, so the gate sits at 20% and the accounting itself
# (GEMM 96% / flash 3% / elementwise 15% / barriers 1% of the whole)
# is the number to watch, not the overlap bias.
t5_rel_gap = 0.20

# T6: f16w coopmat GEMM on real aligned 512-row prefill shapes (TF/s),
# plus the 4096^3 reference figure with its own regression floor.
# Baseline 2026-08-15 measured 24.2 / 32.2 / 24.8 TF/s on the three
# prefill shapes — the floor below is a REGRESSION guard at the worst
# measured shape minus noise.  The >=30 TF/s figure remains the
# ASPIRATIONAL target (documented in THESES.md): reaching ~33 average
# puts pp512 at ~16k t/s ~= CUDA parity; the M=512 K-heavy shapes
# (q/o and down) are the identified prefill blocker.
t6_min_tflops = 22.0
t6_ref_tflops = 34.6
t6_ref_rel_tol = 0.15

# T7 (token exactness) is a correctness invariant: it needs no
# recorded numbers and FAILs unconditionally on any divergence.
