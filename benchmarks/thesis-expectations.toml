# Per-GPU expectations for the performance-thesis harness
# (`ml_bench thesis`, see benchmarks/THESES.md).
#
# Sections are keyed by the EXACT Vulkan device name the harness logs
# (`VulkanContext::device_name`).  A device without a section still
# runs every measurement but reports `info` instead of PASS/FAIL —
# add a section (copying this one and re-recording the numbers from a
# clean run) to arm the regression gate for that GPU.  This is a
# strict TOML subset: quoted-or-bare section headers, `key = <float>`,
# `#` comments (parser: tools/ml-bench/src/bench/thesis/expect.rs).

["NVIDIA GeForce RTX 3070"]
# GA104 spec-sheet memory bandwidth; every bandwidth floor divides by
# this, so per-GPU sections MUST re-record it (e.g. the 4060 is 272).
mem_bw_gbps = 448.0

# T1: decode achieved weight bandwidth >= this fraction of mem_bw_gbps.
# Baseline 2026-08-15 measured 79.4% (356 GB/s) — the floor below is a
# regression guard just under that; 80%+ is the target, and the gap is
# concentrated in the 30%-efficiency k/v projections (see T2), not
# spread across the token.
t1_min_bw_frac = 0.78

# T2: every decode GEMV class >= this fraction of its bandwidth floor
# (leg 13/15: row GEMVs measured 81-89% of floor; the tiny k/v
# 2048x256 class is the one to watch — launch overhead bites first).
# Since campaign/integrate T2 times DRAM-cold (read-mostly GEMV L2
# scrub before every dispatch) — the 3070 has not been re-measured
# under it yet (desktop GPU embargo 2026-09-26); re-record on the next
# 3070 run.
# RE-RECORDED 2026-09-27 (campaign/merge-1 7b926ef, two `thesis --all`
# runs, campaign-tools/work/merge1/thesis-3070-{1,2}.log): DRAM-cold
# q 82/82%, o 80/81% (sat on the old 0.80 boundary), gate/up 92/92%,
# down 88/87%, packed lm_head 96/96%.
t2_min_bw_frac = 0.78
# k/v moves 1.06 MB (floor 2.4 us) and is launch-bound: DRAM-cold it
# measures 14.4-14.6 us = 16% of floor (L2-hot 7.6-7.8 us; the old 25%
# floor came from the 2026-08-15 L2-hot baseline).
t2_kv_min_bw_frac = 0.14

# T3: full compute-barrier drain on a trivial kernel, in microseconds.
# FALSIFIED 2026-08-15: the leg-5-era ~7.7 us figure did not survive
# direct measurement — the chain-slope microbench puts the drain at
# ~0.9 us on GA104/595.80 (34->266 us serial vs 6->31 us overlapped,
# 32->256 dispatches).  The old figure conflated barrier drain with
# per-op submission overhead (T4's ~25 us) from the pre-graph era.
# Consequence: decode's ~158 barriers/token cost ~0.15 ms, not
# ~1.2 ms — barrier elimination is NOT a decode lever.
t3_barrier_us = 0.92
t3_rel_tol = 1.00

# T4: one vkQueueSubmit + fence-wait round-trip, in microseconds
# (campaign ledger: ~30-60 us per synchronous submission on this
# host; v1.5's 50 us spin-wait sits inside this band).  Measured
# value must land in [lo*(1-tol), hi*(1+tol)].
# RE-RECORDED 2026-09-27: 11.7 / 11.4 us per submit (and 11.3 us on
# campaign/integrate the same morning) -- the desktop is now faster
# than the old 30-60 us ledger band, like louise-pc (14 us).
t4_submit_us_lo = 8.0
t4_submit_us_hi = 16.0
t4_edge_tol = 0.20

# T5: |piecewise sum - whole pp512 graph| as a fraction of the whole.
# The sum is expected to OVERestimate (standalone runs cannot overlap
# independent neighbours the way the graph does); baseline 2026-08-15
# measured +15.2%, so the gate sits at 20% and the accounting itself
# (GEMM 96% / flash 3% / elementwise 15% / barriers 1% of the whole)
# is the number to watch, not the overlap bias.
# RE-RECORDED 2026-09-27: +31.6% / +30.3% (sum 39.2 / 38.7 ms vs whole
# 29.8 / 29.7 ms; campaign/integrate measured +28.8%).  The whole got
# faster (SM-aware M-fast a16 tiles) while the f32-A f16w pieces did
# not, so the overestimate grew; the gate guards the accounting.
t5_rel_gap = 0.35

# T6: f16w coopmat GEMM on real aligned 512-row prefill shapes (TF/s),
# plus the 4096^3 reference figure with its own regression floor.
# Baseline 2026-08-15 measured 24.2 / 32.2 / 24.8 TF/s on the three
# prefill shapes — the floor below is a REGRESSION guard at the worst
# measured shape minus noise.  The >=30 TF/s figure remains the
# ASPIRATIONAL target (documented in THESES.md): reaching ~33 average
# puts pp512 at ~16k t/s ~= CUDA parity; the M=512 K-heavy shapes
# (q/o and down) are the identified prefill blocker.
t6_min_tflops = 22.0
t6_ref_tflops = 34.6
t6_ref_rel_tol = 0.15

# T7 (token exactness) is a correctness invariant: it needs no
# recorded numbers and FAILs unconditionally on any divergence.

["NVIDIA GeForce RTX 4060"]
# AD107, 24 SM, 24 MB L2, driver 595.80, host louise-pc (Ryzen 5 5500).
# Recorded 2026-09-26 on campaign/integrate from two full
# `ml_bench thesis --all` runs plus a T2/T6 re-run, then confirmed
# PASS by three gated runs (2026-09-26 x2, 2026-09-27 on the all -Os
# build; raw tables and commands: benchmarks/campaign/integrate.md).  Every floor is a
# measured-reality guard just under the worse run; the AD107 is
# thermally noisy (2460-2745 MHz SM between runs, ~5-7% on GEMM rates).
mem_bw_gbps = 272.0

# T1: 227 / 221 GB/s = 83.5% / 81.3% of 272 (9.10 / 9.35 ms GPU per
# token, 201 dispatches, 156 barriers/token, host +0.30 ms).
t1_min_bw_frac = 0.78

# T2 (DRAM-cold): q 88.6%, o 87.1%, gate/up 92.3%, down 90.8%, packed
# lm_head 94.5% (510.7 us) — within ~3% of the same GEMVs inside a
# real perop decode step.  k/v: 11.9-12.5 us = 31-33% of its 3.9 us
# floor (launch-bound, hidden behind q in decode).
t2_min_bw_frac = 0.82
t2_kv_min_bw_frac = 0.25

# T3: 0.78-0.81 us/barrier in every run (serial 30->227..31->235 us,
# overlapped 6->27..28 us over 32->256 dispatches).
t3_barrier_us = 0.81
t3_rel_tol = 1.00

# T4: louise-pc's round-trip is 14.3-14.7 us in every run (64 submits
# 0.96 ms vs 1 submit 0.06 ms) — half the desktop's; a host property.
t4_submit_us_lo = 10.0
t4_submit_us_hi = 20.0
t4_edge_tol = 0.20

# T5: +11.4% / +17.3% (sum vs whole 39.2-39.6 ms; GEMM 100-107% of
# the whole because the f32-A f16w GEMM pieces run slower than the
# a16 twins prefill uses; flash 4%, elementwise 7%, barriers 1%).
t5_rel_gap = 0.25

# T6 (200 ms warm-up per shape): qkv 22.8-24.8, o 23.1-24.2, gate/up
# 23.4-26.4, down 22.3-24.9 TF/s; 4096^3 24.7-25.3 TF/s.  Aspirational
# target stays >= 30 TF/s (THESES.md).
t6_min_tflops = 20.0
t6_ref_tflops = 25.0
t6_ref_rel_tol = 0.15
