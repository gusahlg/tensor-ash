[package]
name = "tensor-ash"
version.workspace = true
edition.workspace = true

[workspace]
members = [".", "capi", "tools/ml-bench", "tools/test-support"]
resolver = "2"

[workspace.package]
version = "1.4.1"
edition = "2024"

[lib]
name = "tensor_ash"
path = "src/lib.rs"

[dependencies]
ash = "0.38"
bytemuck = { version = "1.16", features = ["derive"] }
parking_lot = "0.12"
anyhow = "1.0"
log = "0.4"
scopeguard = "1.2"

[dev-dependencies]
env_logger = "0.11"
tensor-ash-test-support = { path = "tools/test-support" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
# The C API catches panics at its FFI boundary; aborting here would make
# that safety boundary ineffective for release artifacts.
panic = "unwind"
strip = true

[profile.bench]
inherits = "release"
