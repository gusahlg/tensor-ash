[package]
name = "tensor-ash"
version = "1.1.0"
edition = "2024"

[workspace]
members = [".", "capi"]
resolver = "2"

[lib]
name = "tensor_ash"
path = "src/lib.rs"

[[bin]]
name = "ml_bench"
path = "src/main.rs"

[dependencies]
ash = "0.38"
bytemuck = { version = "1.16", features = ["derive"] }
parking_lot = "0.12"
rayon = "1.10"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
scopeguard = "1.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
